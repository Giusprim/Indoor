<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🚴 Indoor Cycling Planner — Power Ride Coach</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07070d;color:#e8e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
:root{--accent:#00d4aa;--red:#ff4466;--amber:#ffb347;--blue:#4d79ff;--purple:#cc88ff;--bg:#07070d;--s1:#0f0f1a;--s2:#16162a;--s3:#1e1e32;--border:#2a2a44}
header{background:var(--s1);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px}
header h1{font-size:18px;font-weight:700}
header p{font-size:12px;color:#6666aa}
.badge{background:#1a1a40;border:1px solid var(--border);color:var(--accent);padding:3px 10px;border-radius:6px;font-size:11px;font-family:monospace}
main{max-width:900px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:20px}
.card h2{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
textarea,input,select{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:#e8e8f0;padding:10px 12px;font-size:13px;margin-bottom:10px;outline:none;font-family:inherit}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.btn{padding:11px 20px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:opacity .15s}
.btn-primary{background:var(--accent);color:#000}
.btn-gen{background:var(--red);color:#fff;width:100%;padding:14px;font-size:15px}
#ai-log{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;font-family:monospace;height:100px;overflow-y:auto;white-space:pre-wrap;display:none;color:#aaa;margin-top:10px}
.track-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px}
.track-card h3{font-size:14px;font-weight:700;margin-bottom:4px}
.meta{font-size:11px;color:#6666aa;margin-bottom:10px}
.params{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.param{background:var(--s3);border-radius:6px;padding:6px 4px;text-align:center}
.param .v{font-size:14px;font-weight:700;font-family:monospace}
.param .l{font-size:9px;color:#6666aa;text-transform:uppercase;margin-top:2px}
#dl-link{display:none;margin-top:12px;padding:12px 20px;background:var(--s2);border:1px solid var(--accent);border-radius:8px;text-align:center;text-decoration:none;color:var(--accent);font-weight:700}
#apikey-box{background:linear-gradient(135deg,#0a1a0a,#0d1a14);border:2px solid #1DB954;border-radius:12px;padding:20px}
</style>
</head>
<body>

<header>
  <div>
    <h1>🚴 Indoor Cycling Planner</h1>
    <p>Power Ride Coach · Giuseppe Primavera · AIF 2° Livello</p>
  </div>
  <span class="badge">v3.3.8 - Stable</span>
</header>

<main>
  <div id="apikey-box" class="card">
    <h2 style="color:#1DB954">🔑 Gemini API Key</h2>
    <input type="password" id="apikey-input" placeholder="Incolla AIzaSy...">
    <button class="btn btn-primary" onclick="saveApiKey()" style="background:#1DB954">Salva Chiave</button>
  </div>

  <div class="card">
    <h2>1. Importa Brani</h2>
    <textarea id="in-man" rows="8" placeholder="Titolo — Artista | BPM | mm:ss"></textarea>
    <button class="btn btn-primary" onclick="importManual()">Importa Lista</button>
  </div>

  <div class="card">
    <h2>2. Analisi AI</h2>
    <label>Protocollo Lezione</label>
    <select id="wk-protocol">
      <option value="interval_estensivo">Interval Estensivo</option>
      <option value="endurance">Endurance</option>
      <option value="montagna">Montagna</option>
      <option value="hiit">HIIT</option>
    </select>
    <button class="btn btn-gen" onclick="runAI()" id="btn-ai">🤖 Analizza con Gemini (Endpoint v1)</button>
    <div id="ai-log"></div>
  </div>

  <div class="card">
    <h2>3. Revisione</h2>
    <div id="cards"></div>
  </div>

  <div class="card">
    <h2>4. Export</h2>
    <input id="sp-playlist" placeholder="URL Playlist Spotify">
    <button class="btn btn-primary" onclick="generatePlayer()" style="width:100%">Prepara Download</button>
    <a id="dl-link" download="index.html">Scarica index.html</a>
  </div>
</main>

<script>
const KEY_STORAGE = 'gemini_api_key_prc';
let TRACKS = [];

function saveApiKey(){
    localStorage.setItem(KEY_STORAGE, document.getElementById('apikey-input').value.trim());
    alert("Chiave salvata!");
}

function loadApiKey(){ return localStorage.getItem(KEY_STORAGE) || ''; }

function parseTime(t){
    const p = String(t).trim().split(":").map(Number);
    return p.length === 2 ? p[0]*60+p[1] : parseInt(t)||180;
}

function importManual(){
    const raw = document.getElementById("in-man").value.trim();
    if(!raw) return;
    TRACKS = raw.split("\n").filter(l=>l.includes("|")).map((line, i)=>{
        const parts = line.split("|").map(x=>x.trim());
        return {
            i: i+1, title: parts[0], bpm: parts[1], d: parseTime(parts[2]),
            z:"—", rpm:"—", res:"—", tec:"—", mani:"P2", fase:"—", focus:"—", s:0
        };
    });
    renderCards();
}

function renderCards(){
    const wrap = document.getElementById("cards");
    wrap.innerHTML = TRACKS.map(t => `
        <div class="track-card">
            <h3>${t.i}. ${t.title}</h3>
            <div class="meta">BPM: ${t.bpm} | ${Math.floor(t.d/60)}:${String(t.d%60).padStart(2,'0')}</div>
            ${t.z !== "—" ? `<div class="params"><div class="param"><div class="v">${t.z}</div><div class="l">Zona</div></div><div class="param"><div class="v">${t.rpm}</div><div class="l">RPM</div></div></div>` : ""}
        </div>
    `).join("");
}

async function runAI(){
    const apiKey = loadApiKey();
    if(!apiKey) return;
    const btn = document.getElementById("btn-ai");
    const log = document.getElementById("ai-log");
    
    btn.disabled = true;
    log.style.display = "block";
    log.textContent = "Connessione endpoint v1...";

    const protocol = document.getElementById("wk-protocol").value;
    const prompt = `Agisci come Master Instructor Indoor Cycling. Analizza questi dati per un profilo ${protocol}:
${TRACKS.map(t => `Traccia ${t.i}: BPM ${t.bpm}`).join("\n")}

Rispondi SOLO con un array JSON (niente testo o markdown):
[{"zona":"Z2","rpm_label":"90","res_label":"35%","res_num":0.35,"tecnica":"Seduto","mani":"P2","fase":"Lavoro","focus":"Mantieni"}]`;

    try {
        // CORREZIONE DEFINITIVA: Endpoint v1 e specifica modello corretta
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                contents: [{parts: [{text: prompt}]}],
                generationConfig: {
                    responseMimeType: "application/json",
                    temperature: 0.1
                }
            })
        });

        if(!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || "Errore sconosciuto");
        }

        const data = await response.json();
        const results = JSON.parse(data.candidates[0].content.parts[0].text);

        TRACKS = TRACKS.map((t, i) => ({...t, ...results[i]}));
        renderCards();
        log.textContent = "✓ Analisi completata.";
    } catch (e) {
        log.textContent = "ERRORE: " + e.message;
    } finally {
        btn.disabled = false;
    }
}

async function generatePlayer(){
    const blob = new Blob([document.documentElement.outerHTML], {type: "text/html"});
    const a = document.getElementById("dl-link");
    a.href = URL.createObjectURL(blob);
    a.style.display = "block";
    a.textContent = "Clicca qui per scaricare index.html";
}
</script>
</body>
</html>
