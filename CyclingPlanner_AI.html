<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cycling Planner NEW</title>
<style>
 body { font-family: Arial; background:#111; color:#eee; padding:20px; }
 input, textarea, button { width:100%; padding:10px; margin:8px 0; }
 button { background:#00c896; color:#000; font-weight:bold; cursor:pointer; border:0; }
 #log { background:#222; padding:10px; height:120px; overflow:auto; font-size:12px; }
 .section { background:#1b1b1b; padding:15px; border-radius:8px; margin-bottom:15px; }
</style>
</head>
<body>
<h1>🚴 Cycling Planner — Versione SEMPLICE</h1>

<div class="section">
<h3>1️⃣ Importa Playlist Spotify</h3>
<input id="sp-url" placeholder="https://open.spotify.com/playlist/..." />
<button onclick="importSpotify()">IMPORTA PLAYLIST</button>
<pre id="playlist"></pre>
</div>

<div class="section">
<h3>2️⃣ Analisi AI</h3>
<button onclick="startAI()">ANALIZZA CON AI</button>
<pre id="ai"></pre>
</div>

<div class="section">
<h3>Log</h3>
<pre id="log"></pre>
</div>

<script>
function log(t){ document.getElementById('log').textContent += t + "
" }

async function importSpotify(){
 let url = document.getElementById('sp-url').value.trim();
 if(!url.includes('playlist/')){ log('❌ URL non valido'); return; }
 let id = url.split('playlist/')[1].split('?')[0];
 log('➡️ Importo playlist: ' + id);
 let res = await fetch('https://anthropic-proxy.g-primavera-co.workers.dev/spotify',{
   method:'POST', headers:{'Content-Type':'application/json'},
   body: JSON.stringify({ playlist:id })
 });
 let data = await res.json();
 if(!Array.isArray(data)){ log('❌ Errore import'); return; }
 document.getElementById('playlist').textContent = data.map(t=>`${t.title} — ${t.artist}
${t.bpm}
${t.duration}`).join("

");
 log('✅ Import completato');
}

async function startAI(){
 log('➡️ Invio analisi AI...');
 let text = document.getElementById('playlist').textContent;
 let res = await fetch('https://anthropic-proxy.g-primavera-co.workers.dev/claude',{
   method:'POST', headers:{'Content-Type':'application/json'},
   body: JSON.stringify({
     model:"claude-sonnet-4-20250514",
     max_tokens:2000,
     messages:[ { role:"user", content:"Analizza questa playlist:
" + text } ]
   })
 });
 let out = await res.json();
 let t = out.content?.find(x=>x.type==='text')?.text || '';
 document.getElementById('ai').textContent = t;
 log('✅ Analisi AI completata');
}
</script>

</body>
</html>
