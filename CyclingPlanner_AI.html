<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cycling Planner v3.2.7</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#07070d;color:#e8e8f0;font-family:sans-serif;font-size:14px;padding:20px}
  :root{--accent:#00d4aa;--red:#ff4466;--s1:#0f0f1a;--border:#2a2a44}
  .card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;max-width:800px;margin-left:auto;margin-right:auto}
  h2{font-size:14px;color:var(--accent);margin-bottom:15px;text-transform:uppercase}
  textarea,input,select{width:100%;background:#16162a;border:1px solid var(--border);border-radius:8px;color:#fff;padding:12px;margin-bottom:10px;outline:none}
  .btn{padding:12px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:0.2s}
  .btn-primary{background:var(--accent);color:#000}
  .btn-red{background:var(--red);color:#fff}
  #ai-log{background:#000;padding:10px;font-family:monospace;font-size:12px;margin-top:10px;display:none;color:#aaa;border:1px solid #333;white-space:pre-wrap}
  .status-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;background:#333}
  .track-card{background:#16162a;padding:10px;border-radius:8px;margin-top:10px;border-left:4px solid var(--accent)}
  #dl-link{display:none;margin-top:12px;padding:12px;background:var(--accent);color:#000;text-align:center;text-decoration:none;border-radius:8px;font-weight:bold}
  #dl-link.show{display:block}
</style>
</head>
<body>

<div class="card">
  <h2>🔑 Configurazione API Gemini</h2>
  <div style="display:flex;align-items:center;margin-bottom:10px">
    <div id="status-dot" class="status-dot"></div>
    <span id="status-text">Chiave non configurata</span>
  </div>
  <input type="password" id="api-key-input" placeholder="Incolla chiave AIza...">
  <div style="display:flex;gap:10px">
    <button class="btn btn-primary" onclick="saveKey()">SALVA CHIAVE</button>
    <button class="btn" onclick="clearKey()" style="background:#333;color:#fff">CANCELLA</button>
  </div>
</div>

<div class="card">
  <h2>1. Importa Playlist</h2>
  <textarea id="csv-input" rows="5" placeholder="Titolo — Artista | 128 | 3:30"></textarea>
  <button class="btn btn-primary" onclick="importData()">IMPORTA BRANI</button>
</div>

<div class="card">
  <h2>2. Setup & Analisi</h2>
  <label style="font-size:10px; color:#666">PROTOCOLLO</label>
  <select id="wk-protocol">
    <option value="Interval Estensivo">Interval Estensivo</option>
    <option value="Endurance">Endurance</option>
    <option value="Fartlek">Fartlek</option>
  </select>
  <button class="btn btn-red" id="btn-ai" onclick="runAI()" style="width:100%">🤖 ANALIZZA CON GEMINI AI</button>
  <div id="ai-log"></div>
</div>

<div id="track-list" class="card" style="display:none">
  <h2>3. Revisione & Download</h2>
  <div id="tracks-container"></div>
  <input id="sp-playlist" placeholder="URL Playlist Spotify" style="margin-top:20px">
  <button class="btn btn-primary" onclick="generatePlayer()" style="width:100%">GENERA FILE FINALE</button>
  <a id="dl-link" download="index.html">✅ SCARICA INDEX.HTML</a>
</div>

<script>
const STORAGE_KEY = 'gemini_key_v3';
let TRACKS = [];

function saveKey() {
    const key = document.getElementById('api-key-input').value.trim();
    if (!key.startsWith('AIza')) { alert('Chiave non valida'); return; }
    localStorage.setItem(STORAGE_KEY, key);
    checkKey();
}

function clearKey() { localStorage.removeItem(STORAGE_KEY); checkKey(); }

function checkKey() {
    const key = localStorage.getItem(STORAGE_KEY);
    const dot = document.getElementById('status-dot');
    const txt = document.getElementById('status-text');
    if (key) {
        dot.style.background = '#00d4aa';
        txt.textContent = 'API Key Pronta';
        document.getElementById('api-key-input').value = key;
    } else {
        dot.style.background = '#ff4466';
        txt.textContent = 'Mancante';
        document.getElementById('api-key-input').value = '';
    }
}

window.onload = checkKey;

function importData() {
    const input = document.getElementById('csv-input').value.trim();
    if (!input) { alert("Inserisci dei brani!"); return; }
    TRACKS = input.split('\n').filter(l => l.includes('|')).map((line, i) => {
        const p = line.split('|').map(s => s.trim());
        return {
            i: i + 1, title: p[0], bpm: p[1], d: parseTime(p[2]),
            z: '—', rpm: '—', res: '—', tec: '—', mani: 'P2', fase: '—', focus: '—', s: 0
        };
    });
    let cur = 0; TRACKS.forEach(t => { t.s = cur; cur += t.d; });
    renderTracks();
    document.getElementById('track-list').style.display = 'block';
}

function parseTime(t) {
    const p = String(t).split(':').map(Number);
    return p.length === 2 ? p[0] * 60 + p[1] : parseInt(t) || 180;
}

function renderTracks() {
    document.getElementById('tracks-container').innerHTML = TRACKS.map(t => `
        <div class="track-card">
            <strong>${t.i}. ${t.title}</strong> (BPM: ${t.bpm})<br>
            <small>${t.fase} | ${t.z} | ${t.rpm} RPM | ${t.tec}</small>
        </div>
    `).join('');
}

async function runAI() {
    const key = localStorage.getItem(STORAGE_KEY);
    if (!key || TRACKS.length === 0) { alert('Verifica Chiave e Brani!'); return; }

    const log = document.getElementById('ai-log');
    const btn = document.getElementById('btn-ai');
    log.style.display = 'block';
    log.textContent = 'Analisi in corso...';
    btn.disabled = true;

    const protocol = document.getElementById('wk-protocol').value;
    const prompt = `Sei un Master Instructor Indoor Cycling. Analizza questi brani per un profilo ${protocol}.
    Playlist: ${TRACKS.map(t => `${t.i}. BPM ${t.bpm}`).join(', ')}.
    Restituisci SOLO un array JSON senza markdown: [{"zona":"Z2","rpm_label":"85","res_label":"35%","res_num":0.35,"tecnica":"Seduto","mani":"P2","fase":"Lavoro","focus":"Mantieni"}]`;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.1 }
            })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || "Errore 400: Richiesta non valida");

        let cleanJson = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
        const results = JSON.parse(cleanJson);

        TRACKS = TRACKS.map((t, i) => ({
            ...t, z: results[i].zona, rpm: results[i].rpm_label, res: results[i].res_label,
            rn: results[i].res_num, tec: results[i].tecnica, mani: results[i].mani, fase: results[i].fase, focus: results[i].focus
        }));

        renderTracks();
        log.textContent = '✓ Analisi completata con successo!';
    } catch (e) {
        log.textContent = 'ERRORE: ' + e.message;
    } finally {
        btn.disabled = false;
    }
}

async function generatePlayer() {
    const pl = document.getElementById("sp-playlist").value.trim();
    const uri = pl.includes("/playlist/") ? "spotify:playlist:" + pl.split("/playlist/")[1].split("?")[0] : pl;
    
    let tpl = "";
    try {
        const r = await fetch("https://giusprim.github.io/Indoor/index_template_placeholder.html");
        if(r.ok) tpl = await r.text();
    } catch(e) {}
    
    if(!tpl) { alert("Impossibile caricare il template online."); return; }
    
    const final = tpl
        .replace(/\{\{TITLE\}\}/g, "POWER RIDE")
        .replace(/\{\{INSTRUCTOR\}\}/g, "Giuseppe Primavera")
        .replace(/\{\{PLAYLIST_URI\}\}/g, uri)
        .replace("const T = [];// Injected dynamically", `const T = ${JSON.stringify(TRACKS)};`)
        .replace("const TOTAL=3495;", `const TOTAL=${TRACKS.reduce((a,b)=>a+b.d,0)};`);
        
    const blob = new Blob([final], {type: "text/html"});
    const a = document.getElementById("dl-link");
    a.href = URL.createObjectURL(blob);
    a.classList.add("show");
}
</script>
</body>
</html>
