<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Contabattute</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14161a;
    color: #f2f2ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    overscroll-behavior: none;
  }
  .wrap {
    max-width: 480px; margin: 0 auto; padding: 16px 16px 40px;
    min-height: 100%; display: flex; flex-direction: column; gap: 14px;
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; }
  .top-row h1 { font-size: 13px; font-weight: 600; color: #6b6f76; margin: 0; }
  .bpm-pill {
    font-size: 12px; color: #8f948f; background: #1d2026; border: 1px solid #2a2e35;
    border-radius: 20px; padding: 4px 12px; font-variant-numeric: tabular-nums;
  }
  .gear-btn {
    background: transparent; border: none; color: #6b6f76; font-size: 20px;
    cursor: pointer; padding: 4px 8px;
  }

  .stage {
    background: #1d2026; border-radius: 20px; padding: 30px 18px 24px;
    text-align: center; border: 2px solid #2a2e35; transition: border-color 0.25s, background 0.25s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .stage.listening { border-color: #ffb648; }
  .stage.synced { border-color: #33383f; }

  .stage-state { font-size: 13px; font-weight: 600; color: #8f948f; min-height: 18px; }

  .phrase-label { font-size: 13px; color: #6b6f76; letter-spacing: 0.5px; }
  .phrase-value { font-size: 88px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
  .bar-in-phrase { font-size: 14px; color: #8f948f; margin-top: -4px; }

  .beat-dots { display: flex; justify-content: center; gap: 14px; margin-top: 8px; }
  .dot {
    width: 40px; height: 40px; border-radius: 50%; background: #2a2e35;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #6b6f76;
    transition: background 0.06s, color 0.06s, transform 0.06s;
  }
  .dot.on { background: #ff9d5c; color: #1d2026; transform: scale(1.15); }
  .dot.on.first { background: #4fd58a; }

  .bar-dots { display: flex; justify-content: center; gap: 6px; margin-top: 4px; }
  .bar-dot { width: 8px; height: 8px; border-radius: 50%; background: #2a2e35; }
  .bar-dot.done { background: #4a4e56; }
  .bar-dot.now { background: #ff9d5c; }

  .level-meter { width: 100%; height: 4px; background: #2a2e35; border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .level-fill { height: 100%; width: 0%; background: #ffb648; transition: width 0.05s linear; }

  .main-btn {
    border: none; border-radius: 16px; padding: 20px 10px; font-size: 18px; font-weight: 700;
    cursor: pointer; color: #1d2026; background: #ff9d5c;
  }
  .main-btn:active { transform: scale(0.98); }
  .main-btn.stop { background: #e0524b; color: #fff; }

  .hint { font-size: 12px; color: #6b6f76; text-align: center; min-height: 16px; }

  /* pannello impostazioni */
  #settingsPanel { display: none; flex-direction: column; gap: 12px; }
  #settingsPanel.open { display: flex; }
  .settings {
    background: #1d2026; border-radius: 14px; padding: 14px 16px;
    border: 1px solid #2a2e35; display: flex; flex-direction: column; gap: 10px;
  }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .setting-row label { font-size: 13px; color: #c7cac6; }
  .setting-row input[type=number] {
    width: 60px; background: #14161a; border: 1px solid #2a2e35; border-radius: 8px;
    color: #f2f2ee; font-size: 14px; padding: 6px 8px; text-align: center;
  }
  .toggle {
    width: 42px; height: 24px; border-radius: 12px; background: #2a2e35;
    position: relative; cursor: pointer; border: 1px solid #33383f; flex-shrink: 0;
  }
  .toggle.on { background: #ff9d5c; }
  .toggle .knob {
    width: 18px; height: 18px; border-radius: 50%; background: #f2f2ee;
    position: absolute; top: 2px; left: 2px; transition: left 0.12s;
  }
  .toggle.on .knob { left: 21px; }

  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; }
  button.small-btn {
    border: none; border-radius: 10px; padding: 12px 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; color: #f2f2ee; background: #2a2e35;
  }
  button.small-btn:active { transform: scale(0.97); }
  .tap-btn {
    width: 100%; padding: 20px 10px; font-size: 15px; border-radius: 14px;
    background: #262a31; border: 1px solid #33383f; color: #f2f2ee; cursor: pointer;
  }

  /* overlay cambio frase */
  #changeOverlay {
    position: fixed; inset: 0; z-index: 500;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(20,22,26,0.94);
    opacity: 0; pointer-events: none; transition: opacity 0.15s, background 0.2s;
  }
  #changeOverlay.warn { opacity: 1; background: rgba(50,38,10,0.94); }
  #changeOverlay.flash { opacity: 1; background: rgba(20,50,34,0.96); }
  #ovLabel { font-size: 15px; letter-spacing: 2px; color: #ffb648; font-weight: 700; }
  #changeOverlay.flash #ovLabel { color: #4fd58a; }
  #ovNumber { font-size: 130px; font-weight: 800; color: #ffb648; line-height: 1; }
  #changeOverlay.flash #ovNumber { color: #4fd58a; font-size: 70px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-row">
    <h1>Contabattute</h1>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="bpm-pill" id="bpmPill">-- BPM</span>
      <button class="gear-btn" id="gearBtn">&#9881;</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="stage-state" id="stageState">Fermo</div>
    <div class="phrase-label">frase</div>
    <div class="phrase-value" id="phraseValue">--</div>
    <div class="bar-in-phrase" id="barInPhrase"></div>
    <div class="bar-dots" id="barDots"></div>
    <div class="beat-dots" id="beatDots"></div>
    <div class="level-meter"><div class="level-fill" id="levelFill"></div></div>
  </div>

  <button class="main-btn" id="autoBtn">Avvia</button>
  <div class="hint" id="hint">Avvicina il dispositivo alle casse e avvia.</div>

  <div id="settingsPanel">

    <div class="settings">
      <div class="setting-row">
        <label>Battiti per battuta</label>
        <input type="number" id="beatsPerBar" value="4" min="2" max="8">
      </div>
      <div class="setting-row">
        <label>Battute per frase</label>
        <input type="number" id="barsPerPhrase" value="4" min="1" max="16">
      </div>
      <div class="setting-row">
        <label>Tempo minimo sincronizzazione (s)</label>
        <input type="number" id="minSyncSeconds" value="6" min="3" max="20">
      </div>
      <div class="setting-row">
        <label>Click sonoro ogni battito</label>
        <div class="toggle" id="clickToggle"><div class="knob"></div></div>
      </div>
      <div class="setting-row">
        <label>Annuncio vocale a ogni frase</label>
        <div class="toggle on" id="voiceToggle"><div class="knob"></div></div>
      </div>
    </div>

    <div class="row2">
      <button class="small-btn" id="halfBtn">BPM /2</button>
      <button class="small-btn" id="doubleBtn">BPM x2</button>
      <button class="small-btn" id="resyncBtn">Risincronizza</button>
    </div>

    <button class="tap-btn" id="tapBtn">Tap tempo manuale (se l'automatico non aggancia)</button>

    <div class="hint" id="syncProgress"></div>

  </div>

</div>

<div id="changeOverlay">
  <div id="ovLabel">CAMBIO TRA</div>
  <div id="ovNumber">4</div>
</div>

<script>
(function(){
  let audioCtx = null;
  let micStream = null;
  let lowpass = null;
  let processor = null;
  let wakeLock = null;

  let isRunning = false;
  let bpm = 128;
  let beatsPerBar = 4;
  let barsPerPhrase = 4;
  let currentBeat = 1;
  let barCount = 0;
  let nextNoteTime = 0;
  let timerID = null;
  const scheduleAheadTime = 0.12;
  const lookahead = 25;
  let notesInQueue = [];
  let clickEnabled = false;
  let voiceEnabled = true;

  let tapTimes = [];

  let detecting = false;
  let locked = false;
  let energyHistory = [];
  const historySize = 43;
  let beatTimestamps = [];
  let intervalBuffer = [];
  let lastBeatTime = 0;
  let detectionStartTime = 0;
  let minSyncMs = 6000;
  const MIN_BEATS = 8;
  const CV_THRESHOLD = 0.09;

  let overlayShown = null; // null | 'warn' | 'flash'

  const stage = document.getElementById('stage');
  const stageState = document.getElementById('stageState');
  const bpmPill = document.getElementById('bpmPill');
  const levelFill = document.getElementById('levelFill');
  const syncProgress = document.getElementById('syncProgress');
  const phraseValue = document.getElementById('phraseValue');
  const barInPhrase = document.getElementById('barInPhrase');
  const beatDots = document.getElementById('beatDots');
  const barDots = document.getElementById('barDots');
  const autoBtn = document.getElementById('autoBtn');
  const hint = document.getElementById('hint');
  const gearBtn = document.getElementById('gearBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const resyncBtn = document.getElementById('resyncBtn');
  const tapBtn = document.getElementById('tapBtn');
  const halfBtn = document.getElementById('halfBtn');
  const doubleBtn = document.getElementById('doubleBtn');
  const beatsPerBarInput = document.getElementById('beatsPerBar');
  const barsPerPhraseInput = document.getElementById('barsPerPhrase');
  const minSyncInput = document.getElementById('minSyncSeconds');
  const clickToggle = document.getElementById('clickToggle');
  const voiceToggle = document.getElementById('voiceToggle');
  const changeOverlay = document.getElementById('changeOverlay');
  const ovNumber = document.getElementById('ovNumber');
  const ovLabel = document.getElementById('ovLabel');

  gearBtn.addEventListener('click', () => settingsPanel.classList.toggle('open'));

  function ensureAudio(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  async function acquireWakeLock(){
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
    catch (err){ wakeLock = null; }
  }
  function releaseWakeLock(){ if (wakeLock){ wakeLock.release(); wakeLock = null; } }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && detecting && !wakeLock) acquireWakeLock();
    if (document.visibilityState === 'visible' && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  });

  function renderDots(){
    beatDots.innerHTML = '';
    for (let i = 1; i <= beatsPerBar; i++){
      const d = document.createElement('div');
      d.className = 'dot';
      d.textContent = i;
      beatDots.appendChild(d);
    }
    barDots.innerHTML = '';
    for (let i = 0; i < barsPerPhrase; i++){
      const d = document.createElement('div');
      d.className = 'bar-dot';
      barDots.appendChild(d);
    }
  }
  renderDots();

  function updateDots(beat){
    const dots = beatDots.querySelectorAll('.dot');
    dots.forEach((d, i) => {
      d.classList.remove('on', 'first');
      if (i + 1 === beat){
        d.classList.add('on');
        if (beat === 1) d.classList.add('first');
      }
    });
  }

  function updateBarDots(barsIntoPhrase){
    const dots = barDots.querySelectorAll('.bar-dot');
    dots.forEach((d, i) => {
      d.classList.remove('done', 'now');
      if (i < barsIntoPhrase) d.classList.add('done');
      if (i === barsIntoPhrase) d.classList.add('now');
    });
  }

  function setStage(state){
    stage.classList.remove('listening', 'synced');
    if (state === 'listening'){
      stage.classList.add('listening');
      stageState.textContent = 'Sincronizzazione in corso';
    } else if (state === 'synced'){
      stage.classList.add('synced');
      stageState.textContent = 'In esecuzione';
    } else {
      stageState.textContent = 'Fermo';
    }
  }

  function playClick(time, accent){
    if (!clickEnabled) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = accent ? 1500 : 1000;
    gain.gain.setValueAtTime(0.001, time);
    gain.gain.exponentialRampToValueAtTime(accent ? 0.35 : 0.2, time + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + 0.06);
  }

  function playSyncChime(){
    const t0 = audioCtx.currentTime;
    [880, 1320].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      const start = t0 + i * 0.11;
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.18);
    });
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  }

  function speak(text){
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'it-IT';
    u.rate = 1.05;
    window.speechSynthesis.speak(u);
  }

  function scheduleNote(beatNum, barNum, time){
    playClick(time, beatNum === 1);
    notesInQueue.push({ beat: beatNum, bar: barNum, time: time });
  }

  function advanceNote(){
    const secondsPerBeat = 60.0 / bpm;
    nextNoteTime += secondsPerBeat;
    currentBeat++;
    if (currentBeat > beatsPerBar){
      currentBeat = 1;
      barCount++;
    }
  }

  function scheduler(){
    while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime){
      scheduleNote(currentBeat, barCount, nextNoteTime);
      advanceNote();
    }
    timerID = setTimeout(scheduler, lookahead);
  }

  let uiLoopHandle = null;
  let lastAnnouncedPhrase = -1;

  function processNote(note){
    const barsIntoPhrase = note.bar % barsPerPhrase;
    const beatsIntoPhrase = barsIntoPhrase * beatsPerBar + (note.beat - 1);
    const totalBeatsPerPhrase = barsPerPhrase * beatsPerBar;
    const beatsRemaining = totalBeatsPerPhrase - beatsIntoPhrase;
    const phraseNum = Math.floor(note.bar / barsPerPhrase) + 1;

    phraseValue.textContent = phraseNum;
    barInPhrase.textContent = 'battuta ' + (barsIntoPhrase + 1) + ' di ' + barsPerPhrase;
    updateDots(note.beat);
    updateBarDots(barsIntoPhrase);

    const isNewPhrase = barsIntoPhrase === 0 && note.beat === 1;
    const isLastBar = barsIntoPhrase === barsPerPhrase - 1;

    if (isNewPhrase){
      changeOverlay.classList.remove('warn');
      changeOverlay.classList.add('flash');
      ovLabel.textContent = 'FRASE';
      ovNumber.textContent = phraseNum;
      overlayShown = 'flash';
      setTimeout(() => {
        if (overlayShown === 'flash'){ changeOverlay.classList.remove('flash'); overlayShown = null; }
      }, 550);
      if (voiceEnabled && phraseNum !== lastAnnouncedPhrase){
        lastAnnouncedPhrase = phraseNum;
        speak('frase ' + phraseNum);
      }
    } else if (isLastBar){
      changeOverlay.classList.remove('flash');
      changeOverlay.classList.add('warn');
      ovLabel.textContent = 'CAMBIO TRA';
      ovNumber.textContent = beatsRemaining;
      overlayShown = 'warn';
    } else if (overlayShown === 'warn'){
      changeOverlay.classList.remove('warn');
      overlayShown = null;
    }
  }

  function uiLoop(){
    const now = audioCtx ? audioCtx.currentTime : 0;
    while (notesInQueue.length && notesInQueue[0].time < now){
      const note = notesInQueue.shift();
      processNote(note);
    }
    uiLoopHandle = requestAnimationFrame(uiLoop);
  }

  function startClockFromNow(){
    currentBeat = 1;
    barCount = 0;
    lastAnnouncedPhrase = -1;
    notesInQueue = [];
    overlayShown = null;
    changeOverlay.classList.remove('warn', 'flash');
    nextNoteTime = audioCtx.currentTime + 0.05;
    clearTimeout(timerID);
    cancelAnimationFrame(uiLoopHandle);
    scheduler();
    uiLoop();
    isRunning = true;
    bpmPill.textContent = bpm + ' BPM';
  }

  function stopClockOnly(){
    clearTimeout(timerID);
    cancelAnimationFrame(uiLoopHandle);
    isRunning = false;
  }

  function nudgeToOctave(factor){
    bpm = Math.round(bpm * factor * 10) / 10;
    bpmPill.textContent = bpm + ' BPM';
    if (isRunning){
      const secondsPerBeat = 60.0 / bpm;
      nextNoteTime = audioCtx.currentTime + secondsPerBeat;
    }
  }
  halfBtn.addEventListener('click', () => nudgeToOctave(0.5));
  doubleBtn.addEventListener('click', () => nudgeToOctave(2));

  tapBtn.addEventListener('click', () => {
    ensureAudio();
    stopDetection();
    setStage('idle');
    const now = performance.now();
    tapTimes.push(now);
    if (tapTimes.length > 8) tapTimes.shift();
    if (tapTimes.length >= 2){
      const intervals = [];
      for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]);
      const recent = intervals.slice(-6);
      const avgMs = recent.reduce((a,b) => a+b, 0) / recent.length;
      const newBpm = Math.round((60000 / avgMs) * 10) / 10;
      if (newBpm > 40 && newBpm < 220){
        bpm = newBpm;
        bpmPill.textContent = bpm + ' BPM';
      }
    }
    if (tapTimes.length >= 4){
      startClockFromNow();
      setStage('synced');
      hint.textContent = 'Avviato da tap tempo.';
    }
  });
  let tapResetTimer = null;
  tapBtn.addEventListener('click', () => {
    clearTimeout(tapResetTimer);
    tapResetTimer = setTimeout(() => { tapTimes = []; }, 2000);
  });

  beatsPerBarInput.addEventListener('change', () => {
    beatsPerBar = Math.max(2, Math.min(8, parseInt(beatsPerBarInput.value) || 4));
    beatsPerBarInput.value = beatsPerBar;
    renderDots();
  });
  barsPerPhraseInput.addEventListener('change', () => {
    barsPerPhrase = Math.max(1, Math.min(16, parseInt(barsPerPhraseInput.value) || 4));
    barsPerPhraseInput.value = barsPerPhrase;
    renderDots();
  });
  minSyncInput.addEventListener('change', () => {
    const v = Math.max(3, Math.min(20, parseInt(minSyncInput.value) || 6));
    minSyncInput.value = v;
    minSyncMs = v * 1000;
  });
  clickToggle.addEventListener('click', () => {
    clickEnabled = !clickEnabled;
    clickToggle.classList.toggle('on', clickEnabled);
  });
  voiceToggle.addEventListener('click', () => {
    voiceEnabled = !voiceEnabled;
    voiceToggle.classList.toggle('on', voiceEnabled);
    if (voiceEnabled) ensureAudio();
  });

  function resetDetectionBuffers(){
    energyHistory = [];
    beatTimestamps = [];
    intervalBuffer = [];
    lastBeatTime = 0;
    locked = false;
    detectionStartTime = performance.now();
    syncProgress.textContent = 'Battiti rilevati: 0';
  }

  function onAudioProcess(e){
    const input = e.inputBuffer.getChannelData(0);
    let sum = 0;
    for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
    const instantEnergy = sum / input.length;

    const levelPct = Math.min(100, Math.round(Math.sqrt(instantEnergy) * 600));
    levelFill.style.width = levelPct + '%';

    energyHistory.push(instantEnergy);
    if (energyHistory.length > historySize) energyHistory.shift();
    if (energyHistory.length < 10) return;

    const avg = energyHistory.reduce((a,b) => a+b, 0) / energyHistory.length;
    const variance = energyHistory.reduce((a,b) => a + (b-avg)*(b-avg), 0) / energyHistory.length;
    let C = (-0.0025714 * variance) + 1.5142857;
    C = Math.min(3.2, Math.max(1.15, C));

    const now = performance.now();
    if (instantEnergy > C * avg && instantEnergy > 0.00002 && (now - lastBeatTime) > 260){
      lastBeatTime = now;
      registerBeat(now);
    }
  }

  function registerBeat(t){
    beatTimestamps.push(t);
    if (beatTimestamps.length > 20) beatTimestamps.shift();
    if (beatTimestamps.length >= 2){
      const interval = t - beatTimestamps[beatTimestamps.length - 2];
      if (interval > 260 && interval < 1500){
        intervalBuffer.push(interval);
        if (intervalBuffer.length > 16) intervalBuffer.shift();
      }
    }
    evaluateSync(t);
  }

  function evaluateSync(now){
    syncProgress.textContent = 'Battiti rilevati: ' + intervalBuffer.length;
    if (locked) return;
    const elapsed = now - detectionStartTime;
    if (elapsed < minSyncMs) return;
    if (intervalBuffer.length < MIN_BEATS) return;
    const mean = intervalBuffer.reduce((a,b) => a+b, 0) / intervalBuffer.length;
    const variance = intervalBuffer.reduce((a,b) => a + (b-mean)*(b-mean), 0) / intervalBuffer.length;
    const sd = Math.sqrt(variance);
    const cv = sd / mean;
    if (cv < CV_THRESHOLD) lockBpm(mean);
  }

  function lockBpm(meanIntervalMs){
    bpm = Math.round((60000 / meanIntervalMs) * 10) / 10;
    locked = true;
    setStage('synced');
    playSyncChime();
    startClockFromNow();
    hint.textContent = 'Sincronizzato. Se il conteggio sembra sbagliato usa BPM /2 o x2.';
  }

  async function startDetection(){
    try {
      ensureAudio();
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (err){
      hint.textContent = 'Microfono non disponibile: consenti l\'accesso e riprova.';
      return;
    }
    const source = audioCtx.createMediaStreamSource(micStream);
    lowpass = audioCtx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 150;
    processor = audioCtx.createScriptProcessor(1024, 1, 1);
    processor.onaudioprocess = onAudioProcess;
    const silentGain = audioCtx.createGain();
    silentGain.gain.value = 0;
    source.connect(lowpass);
    lowpass.connect(processor);
    processor.connect(silentGain);
    silentGain.connect(audioCtx.destination);

    detecting = true;
    resetDetectionBuffers();
    setStage('listening');
    autoBtn.textContent = 'Ferma';
    autoBtn.classList.add('stop');
    hint.textContent = 'In ascolto, resta fermo qualche secondo.';
    acquireWakeLock();
  }

  function stopDetection(){
    detecting = false;
    if (processor){ processor.disconnect(); processor.onaudioprocess = null; processor = null; }
    if (lowpass){ lowpass.disconnect(); lowpass = null; }
    if (micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    stopClockOnly();
    setStage('idle');
    autoBtn.textContent = 'Avvia';
    autoBtn.classList.remove('stop');
    levelFill.style.width = '0%';
    syncProgress.textContent = '';
    hint.textContent = 'Avvicina il dispositivo alle casse e avvia.';
    releaseWakeLock();
  }

  autoBtn.addEventListener('click', () => {
    if (detecting) stopDetection(); else startDetection();
  });

  resyncBtn.addEventListener('click', () => {
    if (!detecting) return;
    resetDetectionBuffers();
    setStage('listening');
    hint.textContent = 'In ascolto, resta fermo qualche secondo.';
  });
})();
</script>
</body>
</html>
